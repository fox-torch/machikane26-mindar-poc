<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MindAR PoC reference markers</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:24px;background:#f5f5f5;color:#111}
    main{max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    figure{margin:0;padding:12px;background:#fff;border:1px solid #ccc}img{display:block;width:100%;height:auto}
    figcaption{margin-top:8px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>MindAR.js PoC 参考マーカー</h1>
  <p>ARを動かす端末とは別の画面に表示してください。0〜2はFilter判定経路の仮マッピングです。</p>
  <div class="grid">
    <figure><img src="/reference/ar-image-1.jpg"><figcaption>0 — BLUE FILTER (demo)</figcaption></figure>
    <figure><img src="/reference/ar-image-2.jpg"><figcaption>1 — RED FILTER (demo)</figcaption></figure>
    <figure><img src="/reference/ar-image-3.jpg"><figcaption>2 — GREEN FILTER (demo)</figcaption></figure>
    <figure><img src="/reference/ar-image-4.jpg"><figcaption>3 — OBSERVATION SAMPLE</figcaption></figure>
  </div>
</main></body>
</html>
